{% extends "base.html" %}

{% block content %}
  <h1>Log in</h1>

  <form method="post">
    <label>
      Username
      <input
        type="text"
        name="username"
        required
        value="{{ username }}"
        autocomplete="username"
      >
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
      >
    </label>

    <button type="submit">Log in</button>
  </form>

  <p>
    New here?
    <a href="{{ url_for('signup') }}">Create an account</a>.
  </p>
{% endblock %}
