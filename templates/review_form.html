{% extends "base.html" %}

{% block content %}
  <h1>{{ page_title }}</h1>

  <form method="post">
    <label>
      Dining hall
      <select name="dining_hall_name" required>
        <option value="">Choose a dining hall</option>

        {% for dining_hall in dining_halls %}
          <option
            value="{{ dining_hall }}"
            {% if review.get("dining_hall_name") == dining_hall %}selected{% endif %}
          >
            {{ dining_hall }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label>
      Food
      <input
        type="text"
        name="food"
        required
        value="{{ review.get('food', '') }}"
      >
    </label>

    <label>
      Rank
      <select name="rank" required>
        <option value="">Choose a rank</option>

        {% for value in range(1, 6) %}
          <option
            value="{{ value }}"
            {% if review.get("rank", 0)|int == value %}selected{% endif %}
          >
            {{ value }} / 5
          </option>
        {% endfor %}
      </select>
    </label>

    <label>
      Comment
      <textarea name="comment" rows="5">{{ review.get("comment", "") }}</textarea>
    </label>

    <label>
      Date eaten
      <input
        type="date"
        name="meal_date"
        required
        value="{{ review.get("meal_date", "") }}"
      >
    </label>

    <button type="submit">{{ submit_label }}</button>
  </form>
{% endblock %}
