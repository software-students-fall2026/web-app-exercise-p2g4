{% extends "base.html" %}

{% block content %}
  <h1>Create an account</h1>

  <form method="post">
    <label>
      Username
      <input
        type="text"
        name="username"
        required
        value="{{ username }}"
        autocomplete="username"
      >
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        required
        minlength="8"
        autocomplete="new-password"
      >
    </label>

    <p class="help-text">
      Password must contain at least 8 characters.
    </p>

    <button type="submit">Sign up</button>
  </form>

  <p>
    Already have an account?
    <a href="{{ url_for('login') }}">Log in</a>.
  </p>
{% endblock %}
